<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="title desc">
  <title id="title">openTv banner</title>
  <desc id="desc">openTv - Free-to-Air Live TV. Open Source Lover: Raj Gautam | github.com/Rg100152/openTv</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="0.55" stop-color="#152536"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a8e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00a8e8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7ee8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#00a8e8"/>
  <g fill="none" stroke="url(#line)">
    <path d="M0 190 C 220 120, 380 230, 600 160 S 980 110, 1200 180" stroke-width="2"/>
    <path d="M0 215 C 240 150, 400 250, 620 185 S 990 140, 1200 205" stroke-width="1" opacity="0.6"/>
    <path d="M0 165 C 200 100, 360 200, 580 135 S 960 85, 1200 155" stroke-width="1" opacity="0.4"/>
  </g>
  <rect x="72" y="60" width="128" height="30" rx="15" fill="#2c2c2c" stroke="#00a8e8" stroke-width="1"/>
  <circle cx="92" cy="75" r="5" fill="#e5484d"/>
  <text x="106" y="80" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#f1f5f9">FTA LIVE</text>
  <text x="72" y="140" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#f1f5f9">openTv <tspan fill="#00a8e8">—</tspan> Free-to-Air Live TV</text>
  <text x="74" y="176" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#aab6c6">Indian channels, right in your browser. Lightweight by design.</text>
  <text x="74" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#00a8e8">Open Source Lover: Raj Gautam  |  github.com/Rg100152/openTv</text>
  <g fill="none" stroke="#00a8e8" stroke-width="2" opacity="0.5">
    <path d="M1040 60a40 40 0 0 1 0 60" stroke-linecap="round"/>
    <path d="M1055 48a58 58 0 0 1 0 84" stroke-linecap="round"/>
    <path d="M1070 36a76 76 0 0 1 0 108" stroke-linecap="round"/>
